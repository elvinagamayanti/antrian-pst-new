spring.application.name=antrian
server.port = 8099

spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/antrian
spring.datasource.username=root
spring.datasource.password=

spring.jpa.properties.hibernate.sql_sql = true
spring.jpa.properties.hibernate.format_sql = true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

#log setting
logging.level.org.springframework = DEBUG
logging.level.org.hibernate.SQL=DEBUG

# JWT
app.jwt.secret=3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b
app.jwt.expiration-ms=86400000

# Antrian Config
app.antrian.reset-time=00:00
app.antrian.prefix.pengaduan=P
antrian.prefix.konsultasi=K

springdoc.api-docs.path=/docs/api-docs

springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/docs/swagger-ui
springdoc.swagger-ui.tryItOutEnabled=false
springdoc.swagger-ui.filter=false
springdoc.swagger-ui.syntaxHighlight.activated=true

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
